<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card p-4 shadow">

            <h2 class="text-center mb-4">
                Registration
            </h2>

            <form id="registerForm">

                <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">

                <input type="email" id="email" class="form-control mb-3" placeholder="Email">

                <input type="password" id="password" class="form-control mb-3" placeholder="Password">

                <input type="password" id="confirmPassword" class="form-control mb-3" placeholder="Confirm Password">

                <div class="form-check mb-3">

                    <input class="form-check-input" type="checkbox" id="showPassword">

                    <label class="form-check-label">
                        Show Password
                    </label>

                </div>

                <button type="submit" class="btn btn-success w-100">
                    Register
                </button>

            </form>

            <p id="message" class="mt-3 text-center"></p>

            <p class="text-center mt-3">
                Already have an account?
                <a href="login.html">
                    Login Here
                </a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
